version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Platform packages are published by the release workflow, not updated by hand.
      - dependency-name: "@rxpress/*"
      # Types follow the oldest supported Node.js (22), so a newer major would let code use APIs
      # that do not exist there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # tsup 9 changes the shape of dist/index.d.cts, which scripts/fix-cjs-dts.mjs rewrites.
      - dependency-name: "tsup"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler; adopt it deliberately, not through a bot.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
