name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - suffix: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
          - suffix: darwin-x64
            target: x86_64-apple-darwin
            os: macos-15-intel
          - suffix: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - suffix: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - suffix: linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - suffix: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - suffix: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Native (non-musl) targets build directly on a runner of the matching architecture.
      - name: Install Rust
        if: ${{ !matrix.musl }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.musl }}
        run: node scripts/build-native.mjs --target ${{ matrix.target }}

      # musl: build inside an Alpine container (host arch == target arch, so no cross toolchain).
      # `-C target-feature=-crt-static` is required: a cdylib cannot be statically linked to musl.
      - name: Build (musl, Alpine container)
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            node:22-alpine sh -euxc '
              apk add --no-cache build-base curl
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              rustup target add ${{ matrix.target }}
              node scripts/build-native.mjs --target ${{ matrix.target }}
            '
          sudo chown -R "$(id -u):$(id -g)" npm target || true

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.suffix }}
          path: npm/${{ matrix.suffix }}/rxpress.${{ matrix.suffix }}.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*

      - name: Place binaries in npm/<triple>
        run: |
          for dir in bindings-*; do
            suffix="${dir#bindings-}"
            cp "$dir/rxpress.${suffix}.node" "npm/${suffix}/"
          done
          ls -l npm/*/*.node

      - name: Check tag matches package version
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match package.json version"; exit 1; }

      - run: node scripts/version-sync.mjs

      - name: Build TypeScript
        run: |
          npm install --no-audit --no-fund
          npm run build:ts

      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            (cd "$dir" && npm publish --provenance --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish rxpress
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
